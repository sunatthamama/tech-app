<title>ช่าง MJ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="ช่าง MJ">
<meta name="theme-color" content="#141B45">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: แถบเมนูซ้าย + พื้นที่ทำงานเต็มจอ; ข้อมูลอ่านแบบตาราง ปุ่มใหญ่สำหรับงานภาคสนาม */
:root{
  --navy:#25337A; --navy-d:#1A2456; --gold:#CF8C2B; --gold-ink:#2E1C04;
  --bg:#F2F3F7; --card:#FFFFFF; --ink:#1C2236; --soft:#5A6278; --line:#DDE1EA; --tint:#EEF0F8;
  --ok:#1E7F54; --okb:#E4F4EC; --warn:#A86108; --warnb:#FBF0DD; --bad:#B42E28; --badb:#FCEBEA; --info:#1D5FBF; --infob:#E7EEFB; --purple:#6A3DAE; --purpleb:#F0E9FA;
  --sub:#1F6F6A; --subb:#E5F2F0;
  --f-body:'IBM Plex Sans Thai',Tahoma,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121522; --card:#1A1E2D; --ink:#E9ECF4; --soft:#9BA3B9; --line:#2C3247; --tint:#22283C;
  --okb:#15362A; --warnb:#3A2A12; --badb:#3D1C1B; --infob:#18284A; --purpleb:#2A2140; --subb:#16302E;
  --ok:#5FD19C; --warn:#F0B35A; --bad:#F2837C; --info:#8DB4F5; --purple:#C2A2F2; --sub:#7CD3CA; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121522; --card:#1A1E2D; --ink:#E9ECF4; --soft:#9BA3B9; --line:#2C3247; --tint:#22283C;
  --okb:#15362A; --warnb:#3A2A12; --badb:#3D1C1B; --infob:#18284A; --purpleb:#2A2140; --subb:#16302E;
  --ok:#5FD19C; --warn:#F0B35A; --bad:#F2837C; --info:#8DB4F5; --purple:#C2A2F2; --sub:#7CD3CA; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:flex;min-height:100%}
.nav{width:212px;flex:0 0 auto;background:var(--navy-d);color:#fff;display:flex;flex-direction:column;padding:16px 10px;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand b{width:34px;height:34px;border-radius:9px;background:var(--gold);color:var(--navy-d);display:flex;align-items:center;justify-content:center;font-size:17px}
.brand span{font-weight:700;line-height:1.2;font-size:14px}.brand small{display:block;font-weight:400;color:#AEB6DA;font-size:11px}
.navsec{font-size:10.5px;letter-spacing:.06em;color:#8E97C4;padding:12px 10px 4px;text-transform:uppercase}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:transparent;color:#D5DAF0;padding:9px 10px;border-radius:9px;font-size:13.5px}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
.nav .cnt{font-size:11px;background:rgba(255,255,255,.18);border-radius:10px;padding:0 7px}
.nav .cnt.bad{background:#C6362F;color:#fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.top h1{font-size:18px;margin:0;font-weight:700;text-wrap:balance}
.sp{flex:1}
.ctl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--soft)}
.ctl select,.ctl input[type=range]{accent-color:var(--gold)}
select,input[type=text],input[type=number],input[type=date],input[type=tel],textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13.5px}
.content{padding-block:18px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h3{font-size:13.5px;margin:12px 0 6px}
.muted{color:var(--soft)} .small{font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1100px){.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:1px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--okb);color:var(--ok)} .p-warn{background:var(--warnb);color:var(--warn)} .p-bad{background:var(--badb);color:var(--bad)} .p-info{background:var(--infob);color:var(--info)} .p-pur{background:var(--purpleb);color:var(--purple)} .p-mute{background:var(--tint);color:var(--soft)} .p-sub{background:var(--subb);color:var(--sub)}
.gap{background:var(--warnb);border:1px dashed var(--warn);color:var(--warn);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:600}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11.5px;color:var(--soft);font-weight:600;border-bottom:1px solid var(--line);padding:7px 8px;white-space:nowrap}
table.t td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--tint)}
.tw{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--soft)} .kpi .v{font-family:var(--f-mono);font-size:24px;font-weight:600}
.kpi.bad{background:var(--badb);border-color:transparent} .kpi.bad .v,.kpi.bad .l{color:var(--bad)}
/* ตารางงาน */
.board{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);max-height:calc(100vh - 210px)}
.bgrid{display:grid;width:max-content}
.bh{position:sticky;top:0;z-index:3;background:var(--card);border-bottom:2px solid var(--line);padding:8px;font-size:12px}
.bh.emp{border-top:4px solid var(--navy)} .bh.sub{border-top:4px solid var(--sub);background:var(--subb)}
.bh .tm{font-family:var(--f-mono);font-weight:600;color:var(--warn)} .bh.sub .tm{color:var(--sub)}
.bh .names{font-weight:600;font-size:12.5px;line-height:1.35;min-height:34px}
.bh .names.empty{color:var(--bad)}
.tc{position:sticky;left:0;z-index:2;background:var(--card);border-right:1px solid var(--line);padding:8px;font-family:var(--f-mono);font-weight:600;font-size:12.5px;display:flex;align-items:center}
.corner{position:sticky;left:0;top:0;z-index:4;background:var(--card);border-bottom:2px solid var(--line);border-right:1px solid var(--line);padding:8px;font-size:11.5px;color:var(--soft)}
.slot{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;min-height:88px}
.slot.sub{background:color-mix(in srgb,var(--subb) 45%,transparent)}
.slot.drop{outline:2px dashed var(--gold);outline-offset:-4px}
.job{border-radius:8px;padding:6px 8px;font-size:12px;border-left:4px solid var(--soft);background:var(--tint);cursor:pointer;display:flex;flex-direction:column;gap:1px;height:100%;min-height:76px;text-align:left;width:100%;border-top:0;border-right:0;border-bottom:0}
.job .no{font-family:var(--f-mono);font-weight:600;font-size:11.5px;display:flex;justify-content:space-between;gap:4px}
.job .cu{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .st{font-weight:600;font-size:11.5px}
.job .lamp{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto;margin-top:3px}
.lamp.y{background:#E2A13A} .lamp.r{background:#D9443C;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}} @media (prefers-reduced-motion:reduce){.lamp.r{animation:none}}
.s0{border-left-color:#8A93A8} .s1{border-left-color:#B4690E;background:var(--warnb)} .s2{border-left-color:#C77A12;background:var(--warnb)} .s3{border-left-color:#3B4FB0;background:var(--tint)} .s4{border-left-color:var(--info);background:var(--infob)} .s5{border-left-color:var(--info);background:var(--infob)} .s6{border-left-color:#B45309;background:var(--warnb)} .s7{border-left-color:var(--ok);background:var(--okb)} .s8{border-left-color:var(--purple);background:var(--purpleb)} .s9{border-left-color:var(--ok);background:var(--okb)} .s10{border-left-color:var(--ok);background:var(--okb);opacity:.75} .scx{border-left-color:var(--bad);background:var(--badb);opacity:.7}
.vac{border:1.5px dashed var(--line);border-radius:8px;min-height:76px;height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--soft);background:transparent;width:100%}
.vac:hover{border-color:var(--navy);color:var(--navy)}
.noroster{border-radius:8px;min-height:76px;height:100%;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--soft);background:repeating-linear-gradient(135deg,transparent 0 6px,var(--tint) 6px 12px)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,14,28,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:40;overflow:auto}
.md{background:var(--card);border-radius:14px;width:min(860px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.md.sm{width:min(520px,100%)}
.mh{background:var(--navy);color:#fff;border-radius:14px 14px 0 0;padding:14px 18px;display:flex;justify-content:space-between;gap:12px}
.mh h3{margin:2px 0 0;font-size:17px} .mh .x{border:0;background:rgba(255,255,255,.14);color:#fff;width:34px;height:34px;border-radius:8px;flex:0 0 auto}
.mb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.steps{display:flex;flex-wrap:wrap;gap:4px}
.steps span{font-size:11px;padding:3px 8px;border-radius:12px;background:var(--tint);color:var(--soft)}
.steps span.done{background:var(--okb);color:var(--ok)} .steps span.cur{background:var(--gold);color:var(--gold-ink);font-weight:700}
.next{border:1px solid var(--gold);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.hist{list-style:none;margin:0;padding:0;font-size:12.5px;display:flex;flex-direction:column;gap:5px}
.hist b{font-family:var(--f-mono);font-weight:600}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--soft)}
.fld input,.fld select,.fld textarea{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.q{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.q.on{border-color:var(--navy);background:var(--tint)}
.q label.h{display:flex;gap:8px;align-items:flex-start;font-weight:600;cursor:pointer}
.q .val{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.q .val input[type=number]{width:90px}
.code{font-family:var(--f-mono);font-weight:700;color:var(--bad)}
.parts{display:flex;flex-direction:column;gap:6px}
.part{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px}
.part.off{opacity:.5}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy-d);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:60;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
/* แอปช่าง */
.phone{width:390px;max-width:100%;border:10px solid #10142A;border-radius:34px;background:var(--bg);min-height:760px;overflow:hidden;display:flex;flex-direction:column}
.ph-h{background:var(--navy-d);color:#fff;padding:16px}
.ph-b{padding:12px;display:flex;flex-direction:column;gap:10px;flex:1}
.bigbtn{border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;background:var(--navy);color:#fff;width:100%}
.bigbtn.gold{background:var(--gold);color:var(--gold-ink)} .bigbtn.ghost{background:var(--card);color:var(--navy);border:1.5px solid var(--navy)}
.wi{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);display:flex;flex-direction:column;gap:6px;font-size:13px}
.wi.done{border-color:var(--ok);background:var(--okb)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{width:64px;height:48px;border-radius:6px;object-fit:cover;background:var(--tint);border:1px solid var(--line)}
.pkg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pkg button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 8px;font-size:13px;font-weight:600;text-align:left;min-height:64px}
.pkg button.on{border-color:var(--navy);background:var(--tint)}
.pkg small{display:block;font-weight:400;color:var(--soft);font-family:var(--f-mono)}
canvas.sig{width:100%;height:140px;border:1.5px dashed var(--line);border-radius:10px;background:var(--card);touch-action:none}
.report{border:1px solid var(--line);border-radius:10px;padding:16px;font-size:13px;display:flex;flex-direction:column;gap:10px}
.report h4{margin:0;font-size:15px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:140px 1fr 44px;gap:8px;align-items:center;font-size:12.5px}
.bar i{display:block;height:14px;border-radius:4px;background:var(--navy)}
.bar i.g{background:var(--gold)}
.bar .tr{background:var(--tint);border-radius:4px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.flow span{background:var(--tint);border-radius:8px;padding:5px 9px}
.flow em{font-style:normal;color:var(--soft)}
@media (max-width:820px){.nav{position:fixed;inset:auto 0 0 0;top:auto;height:auto;width:100%;flex-direction:row;overflow-x:auto;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
  .nav .brand,.nav .navsec{display:none} .nav button{white-space:nowrap;width:auto} .content{padding-bottom:90px}}

/* ===== ตารางงานแบบเลื่อนต่อเนื่อง (สไตล์ Dispatch Board) ===== */
.boardbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.p-gold{background:var(--gold);color:var(--gold-ink)}
.board{position:relative;max-height:calc(100vh - 250px);min-height:420px;scroll-behavior:auto}
.bh{padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.bh.emp{border-top:3px solid var(--navy)} .bh.sub{border-top:3px solid var(--sub);background:var(--card)}
.bh .grp{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--navy);text-transform:uppercase;white-space:nowrap} .bh.sub .grp{color:var(--sub)} .bh .grp.ghost{visibility:hidden}
.bh .zone{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.bh.sep,.sepcol{background:repeating-linear-gradient(180deg,var(--sub) 0 6px,transparent 6px 12px);opacity:.35;border:0;padding:0}
.bh.sep{position:sticky;top:0;z-index:4}
.bh{z-index:4}.corner{z-index:5}
.avs{display:flex;align-items:center}
.av{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;margin-left:-4px;border:2px solid var(--card)} .av:first-child{margin-left:0}
.bh.sub .av{background:var(--sub)}
.dayband{grid-column:1/-1;position:sticky;top:var(--hh,108px);z-index:3;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0}
.dayband .dlab{position:sticky;left:0;display:inline-flex;align-items:center;gap:8px;padding:0 12px;font-size:13px;white-space:nowrap}
.dayband.today{background:color-mix(in srgb,var(--gold) 14%,var(--bg))}
.dayband.past .dlab b{color:var(--soft)}
.tc{flex-direction:column;align-items:flex-start;justify-content:center;gap:0;background:var(--card);border-bottom:1px solid var(--line)}
.tc.rost{font-family:var(--f-body);color:var(--soft);font-weight:600}
.rcell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 8px;font-size:11.5px;background:var(--tint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcell.sub{background:var(--subb)}
.norost{color:var(--bad);font-weight:600}
.lnk{border:0;background:none;color:var(--navy);font-weight:700;font-size:11.5px;padding:0;text-decoration:underline}
.slot{min-height:84px;padding:4px;background:var(--card)}
.slot.sub{background:color-mix(in srgb,var(--subb) 40%,var(--card))}
.job{min-height:74px;padding:5px 8px;gap:0;border-radius:6px;box-shadow:0 1px 0 rgba(20,30,70,.06)}
.job .ar{font-size:10.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .st{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .stg{font-size:10.5px;color:var(--soft)}
.vac{min-height:74px;font-size:18px;border-radius:6px;border-color:transparent;color:transparent}
.slot:hover .vac:not(:disabled){border-color:var(--line);color:var(--soft)}
.vac:disabled{cursor:default}
.noroster{min-height:74px;font-size:10.5px}
.side{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 100px);overflow:auto}
.kpi{padding:10px 14px} .kpi .v{font-size:22px}

/* ===== Homeตามบทบาท + ใบสั่งงานแบบ PMJO ===== */
.cues{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.cue{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--soft)}
.cue b{font-family:var(--f-mono);font-size:30px;color:var(--ink);font-weight:600}
.cue:hover{border-color:var(--navy)} .cue.hot{background:var(--badb);border-color:transparent;color:var(--bad)} .cue.hot b{color:var(--bad)}
.md.wide{width:min(1180px,100%)}

/* ===== NAV-style skin (Dynamics NAV 2017/2018 web client look) ===== */

/* ===== Design pass: "Service Desk" — NAV structure, cold-chain identity =====
   Palette: Harbor #0B2545 (chrome) · Coolant #0F7C86 (progress/accent) · Frost #F5F8FA (canvas) · Steel #D3DAE2 (rules) · Ink #17212B · Alarm #C42B1C
   Type: IBM Plex Sans Thai only (Thai+Latin share one voice); Plex Mono only for real document numbers.
   Bold spend: the 10-stage pipeline on the Service Order. Everything else stays quiet. */
:root{--navy:#0B2545;--navy-d:#0B2545;--gold:#0F7C86;--gold-ink:#fff;--bg:#F5F8FA;--card:#fff;--tint:#EDF1F4;--line:#D3DAE2;--ink:#17212B;--soft:#56626E;--info:#0B5CAD;--bad:#C42B1C;--badb:#FCECEA;

/* ===== v10.3 โทนใหม่: กรมเข้มลึก + ทองอุ่น · ฟอนต์ Anuphan (UI) + JetBrains Mono (ตัวเลข) ===== */
:root{ --t-f:'Anuphan','IBM Plex Sans Thai',system-ui,sans-serif; --t-m:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;
  --t-navy-d:#121A3F; --t-ink:#141B34; --t-bg:#F3F4F8; --t-tint:#ECEEF8; --t-soft:#59617A; --t-line:#E4E7F0; }
body,#tapp{ font-family:var(--t-f); letter-spacing:.005em }
#tapp h1,#tapp h2,.jh h1{ font-weight:600; letter-spacing:-.01em }
.tb{ background:var(--t-navy-d) }
.tb::before{ background:linear-gradient(135deg,#E2A54A,#CF8C2B); }
.jh h1{ font-size:26px }
.jc .tm,.jh .appt b,.tot b{ font-weight:600 }
.tl-card h1{ font-size:24px }

/* โหมดโฟกัส */
.fx{ position:fixed; inset:0; z-index:40; background:#121A3F; color:#fff; display:flex; flex-direction:column; padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px)); gap:12px; overflow:auto }
.fx-h{ display:flex; align-items:center; gap:14px }
.fx-x{ all:unset; cursor:pointer; padding:10px 14px; border-radius:14px; background:rgba(255,255,255,.1); font-weight:600 }
.fx-x:focus-visible{ outline:2px solid #E2A54A }
.fx-t{ flex:1; min-width:0; display:flex; flex-direction:column } .fx-t b{ font-size:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis } .fx-t span{ font-size:13px; color:#AEB6D8; font-family:var(--t-m) }
.fx-ring{ --p:0; width:58px; height:58px; border-radius:50%; background:conic-gradient(#E2A54A calc(var(--p)*1%),rgba(255,255,255,.14) 0); display:flex; align-items:center; justify-content:center; flex:none }
.fx-ring span{ width:46px; height:46px; border-radius:50%; background:#121A3F; display:flex; align-items:baseline; justify-content:center; padding-top:12px; box-sizing:border-box; font-family:var(--t-m); font-weight:600; font-size:17px } .fx-ring small{ font-size:10px; color:#AEB6D8 }
.fx-st{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; max-width:820px; width:100%; margin:0 auto } .fx-st b{ font-size:24px; font-weight:600 } .fx-st span{ color:#AEB6D8; font-size:14px }
.fx-body{ flex:1; max-width:820px; width:100%; margin:0 auto; display:flex; flex-direction:column }
.fx-body>*{ display:none!important } .fx-body>.fx-on{ display:flex!important; animation:fxin .22s ease-out }
.fx-body>.note.fx-on,.fx-body>.doc.fx-on{ display:block!important }
.fx-body .card{ color:var(--t-ink); padding:22px 24px!important; font-size:16px }
.fx-body .card h3{ font-size:14px!important } .fx-body .btn{ min-height:54px; font-size:16px } .fx-body .chk input[type=checkbox]{ width:32px; height:32px }
.fx-body .ph img,.fx-body .ph .add{ width:110px; height:110px }
@keyframes fxin{ from{ opacity:.4; transform:translateY(8px) } to{ opacity:1; transform:none } }
.fx-f{ display:flex; gap:12px; max-width:820px; width:100%; margin:0 auto }
.fx-b{ all:unset; box-sizing:border-box; cursor:pointer; flex:1; min-height:64px; border-radius:18px; text-align:center; font-weight:600; font-size:18px; background:rgba(255,255,255,.1); color:#fff; display:flex; align-items:center; justify-content:center }
.fx-b.go{ flex:2; background:linear-gradient(135deg,#E2A54A,#CF8C2B); color:#2E1C04; box-shadow:0 8px 24px rgba(207,140,43,.35) }
.fx-b[disabled]{ opacity:.35; cursor:not-allowed; box-shadow:none } .fx-b:focus-visible{ outline:2px solid #fff; outline-offset:2px }
.fx-need{ max-width:820px; width:100%; margin:0 auto; text-align:center; color:#F2C98A; font-size:14px; min-height:20px }
@media (prefers-reduced-motion:reduce){ .fx-body>.fx-on{ animation:none } }
#tapp .card h3{ justify-content:flex-start; align-items:center; flex-wrap:wrap; gap:4px 8px; color:var(--t-navy) }
#tapp .card h3::before{ margin-right:2px }
@keyframes fxin{ from{ transform:translateY(10px) } to{ transform:none } }

/* ===================== iPad (v10.3) ===================== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
#tapp{-webkit-tap-highlight-color:transparent}
#tapp button,#tapp a,#tapp .jc,#tapp label,#tapp select{touch-action:manipulation}
/* iOS zooms into fields under 16px — keep them at 16px */
#tapp input:not([type=checkbox]):not([type=radio]),#tapp select,#tapp textarea{font-size:16px}
#tapp .btn{min-height:44px}
#tapp .btn.sm{min-height:36px}
/* stepper: all 10 stages fit the width, current one scrolled into view */
.stp button{flex:1 1 0;min-width:58px}
.stp{scroll-snap-type:x proximity}.stp button{scroll-snap-align:center}
/* standalone (Add to Home Screen): respect the notch / home bar */
@media (display-mode:standalone){ .tb{padding-top:max(10px,env(safe-area-inset-top,0px))} }

/* iPad portrait (768–1100 wide): job list becomes a swipeable strip on top, work area full width */
@media (min-width:701px) and (max-width:1100px) and (orientation:portrait){
  .tw{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .rail,.ws{min-width:0}
  .tw.open .rail,.tw .rail{display:flex}
  .rail{padding:0 0 0 max(8px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--t-line)}
  .rail-h{padding:12px 16px 6px;gap:6px}
  .rail-h h2{font-size:16px}
  .rail-l{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:4px 16px 14px 8px;gap:10px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .rail-l::-webkit-scrollbar{display:none}
  .jc{flex:0 0 228px;scroll-snap-align:start;padding:12px 14px 12px 16px}
  .jc .tm{font-size:18px}
  .jc .nm{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ws-in{padding-left:max(16px,env(safe-area-inset-left,0px));max-width:none}
  .stp{padding:12px 6px 8px}
  .stp button{font-size:10.5px;min-width:62px}
  .stp button i{width:26px;height:26px}
  .ab{margin:auto 12px 12px}
}
/* iPad landscape: slightly narrower rail so the work area breathes */
@media (min-width:1000px) and (max-width:1200px) and (orientation:landscape){ .tw{grid-template-columns:290px minmax(0,1fr)} }

/* ===================== v11 design — field tool, high contrast, one task per screen ===================== */
:root{
  --t-navy:#1F2B6E; --t-navy-d:#141B45; --t-gold:#C97F1A; --t-gold-ink:#2B1A03;
  --t-bg:#F3F4F7; --t-card:#FFFFFF; --t-ink:#121729; --t-soft:#4B5468; --t-line:#DCE0E8; --t-tint:#EEF1FA;
  --t-ok:#0F7B4A; --t-okb:#E3F4EA; --t-warn:#9A5B00; --t-warnb:#FFF2D9; --t-bad:#B42318; --t-badb:#FDECEA; --t-wait:#6B7385; --t-waitb:#ECEEF2;
  --t-f:'Anuphan','IBM Plex Sans Thai',system-ui,sans-serif; --t-m:'Anuphan','IBM Plex Sans Thai',system-ui,sans-serif;
  --t-r:14px; --t-sh:none;
}
html,body{background:var(--t-bg)}
body{font-size:16px;line-height:1.55;color:var(--t-ink);font-feature-settings:"tnum"}
#tapp .mono{font-family:var(--t-f);font-variant-numeric:tabular-nums;letter-spacing:.01em}
#tapp :focus-visible{outline:3px solid #6F8BFF;outline-offset:2px}

/* ---------- top bar ---------- */
#tapp .tb{background:var(--t-navy-d);box-shadow:none;gap:12px;padding-block:10px;min-height:60px;box-sizing:border-box}
#tapp .tb::before{display:none}
#tapp .tb .brand{width:38px;height:38px;border-radius:10px;background:var(--t-gold);color:var(--t-navy-d);font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;flex:none}
#tapp .tb .who b{font-size:16px}
#tapp .tb .who span{font-size:13px;color:#C3C9E3}
#tapp .tb .off{background:#F2837C;color:#3D1C1B;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600}
#tapp .tb .acts{gap:8px}
#tapp .tb .tbb{border-radius:10px;min-height:44px;padding:8px 16px;font-size:15px;font-weight:600;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff}
#tapp .tb .tbb.ghost{background:transparent;border-color:transparent;color:#C3C9E3}
#tapp .tb .cnt{background:#E5484D;color:#fff;border-radius:10px;font-size:12px;padding:1px 7px;margin-left:6px;font-weight:700}

/* ---------- job list ---------- */
#tapp .tw{grid-template-columns:300px minmax(0,1fr)}
#tapp .rail{background:var(--t-card);border-right:1px solid var(--t-line);padding:0}
#tapp .rail-h{flex-direction:row;align-items:baseline;justify-content:space-between;padding:18px 18px 10px}
#tapp .rail-h h2{font-size:18px;margin:0}
#tapp .rail-h .cntx{font-size:14px;color:var(--t-soft);font-weight:600}
#tapp .newb{margin:0 14px 10px;background:#FFF2D9;border:1px solid #F0C878;border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14.5px}
#tapp .newb button{all:unset;cursor:pointer;background:var(--t-navy);color:#fff;border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px;min-height:28px}
#tapp .rail-l{padding:2px 12px 24px;gap:8px}
#tapp .jc{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"tm st" "nm nm" "mt mt";gap:2px 10px;padding:14px 14px 14px 16px;border-radius:12px;background:var(--t-card);border:1px solid var(--t-line);box-shadow:none;position:relative}
#tapp .jc::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--t-wait)}
#tapp .jc .tm{grid-area:tm;font-size:20px;font-weight:700;color:var(--t-ink);font-variant-numeric:tabular-nums;letter-spacing:0}
#tapp .jc .tm small{font-size:13px;font-weight:600;color:var(--t-soft)}
#tapp .jc .st{grid-area:st;justify-self:end;align-self:center;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--t-waitb);color:var(--t-soft);white-space:nowrap}

#tapp .jc .mt{grid-area:mt;font-size:14px;color:var(--t-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tapp .jc.on{border-color:var(--t-navy);box-shadow:0 0 0 2px var(--t-navy);background:#F6F8FF}
#tapp .jc[disabled]{opacity:.55;cursor:not-allowed}
#tapp .jc.st-run::before{background:#00B050} #tapp .jc.st-run .st{background:#D8F2E2;color:#0B5A36}
#tapp .jc.st-done::before{background:#5FAFC4} #tapp .jc.st-done .st{background:#E6F4F8;color:#1C5E70}
#tapp .jc.st-warn::before{background:#E59866} #tapp .jc.st-warn .st{background:#FCE4D6;color:#7A3A10}
#tapp .jc.st-hold::before{background:#BFBFBF}
#tapp .jc.st-wait::before{background:#8EA9DB} #tapp .jc.st-wait .st{background:#DCE6F4;color:#1F3864}

/* ---------- workspace ---------- */
#tapp .ws-in{padding:20px max(20px,env(safe-area-inset-right,0px)) 140px 24px;gap:14px;max-width:900px}
#tapp .back{all:unset;cursor:pointer;color:var(--t-navy);font-weight:600;font-size:16px;padding:6px 0;min-height:32px}

#tapp .jh{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--t-card);border:1px solid var(--t-line);border-radius:var(--t-r);padding:16px 18px;box-shadow:none}

/* progress (replaces the 10-label stepper) */
#tapp .pg{background:var(--t-card);border:1px solid var(--t-line);border-radius:var(--t-r);padding:14px 18px 16px}
#tapp .pg-t{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
#tapp .pg-n{font-size:15px;font-weight:700;color:var(--t-soft)} #tapp .pg-n small{font-weight:600}

#tapp .pg-b{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
#tapp .pg-b button{all:unset;cursor:pointer;height:10px;border-radius:5px;background:#DCE0E8;position:relative}
#tapp .pg-b button::after{content:"";position:absolute;inset:-12px 0}
#tapp .pg-b button.d{background:var(--t-ok)}

#tapp .card{background:var(--t-card);border:1px solid var(--t-line);border-radius:var(--t-r);box-shadow:none;padding:18px 20px}
#tapp .card h3{font-size:17px;color:var(--t-ink);margin:0 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;text-transform:none;letter-spacing:0}

@media (min-width:701px) and (max-width:1100px) and (orientation:portrait){

function lamp(j){
  if(j.cancel || j.step>=10) return null;
  const d = j.date, n = S.now, t = toMin(SLOT_T[j.si]);
  const isToday = d===TODAY, isTom = d===addD(TODAY,1), past = d<TODAY;
  if(j.step<=1 && (isToday||past)) return ['r','Service day reached, not confirmed / no requisition'];
  if(j.step<=1 && isTom){ if(n>=1020) return ['r','Past 17:00 D-1, appointment not confirmed']; if(n>=900) return ['y','Appointment confirmation due soon D-1']; }
  if(j.step===2 && isToday && n>=480) return ['r','Parts not yet issued'];
  if(j.step===2 && isTom && n>=1020 && j.req.state==='sent') return ['y','Picking not started'];
  if(j.step===3 && isToday){ if(n>=510) return ['r','Past 08:30, not allocated']; if(n>=480) return ['y','Allocation due soon']; }
  if(j.dispatched && !j.confirmCall && j.step<6) return ['y','Allocated without confirmed appointment'];
  if((j.step===4||j.step===5) && isToday && !j.tech.arrive){ if(n>=t+30) return ['r','Not on site (over 30 min)']; if(n>=t+15) return ['y','Appointment time approaching']; }
  if(j.step===6 && j.tech.closedAt!=null && isToday){ if(n>=j.tech.closedAt+180) return ['r','Parts return over 3 h.']; if(n>=j.tech.closedAt+135) return ['y','Parts return due soon']; }
  if(j.step===7 && past) return ['y','Post shipment pending over 18 h.'];
  if(j.step===8 && j.fu && j.fu.state==='cc'){ if(TODAY>addD(j.fu.sentAt,FU_CC_DAYS)) return ['r','Follow-up not booked by Call Center over '+FU_CC_DAYS+' days']; if(TODAY>j.fu.sentAt) return ['y','Follow-up waiting for Call Center booking']; }
  if(j.step===9 && j.refund && j.refund.state!=='done') return ['y','Customer refund pending'];
  if(j.step===9 && past && d<addD(TODAY,-1)) return ['r','Invoice posting over 2 days'];
  return null;
}

function dDrop(e,ci,si,d){ e.preventDefault(); e.currentTarget.classList.remove('drop'); const j=job(e.dataTransfer.getData('text/plain')); if(!j) return;

  if(occ(d,ci,si,j.no)) return toast(lockOf(d,ci,si)?'This slot is locked':'Slot already taken'); if(j.span===2&&(si+1>=SLOT_T.length||occ(d,ci,si+1,j.no))) return toast('This order needs 2 slots – next slot is taken');
  if(j.step>=5 && j.tech.arrive) return toast('Technician already started – cannot move');

    <div class="flow"><span>รับอะไหล่</span><em>→</em><span>ถึงหน้างาน</span><em>→</em><span>WI + รูป</span><em>→</em><span>Result + parts used</span><em>→</em><span>เสนอราคา</span><em>→</em><span>ลายเซ็น</span><em>→</em><span>ใบรายงาน + QR</span></div></div></div>`; }
function techJob(j){ const T=j.tech; const wi=WI[j.sym[0]]||(j.clean?[['ล้างแผ่นกรองและคอยล์เย็น',1],['ล้างคอยล์ร้อน',1],['ทดสอบการทำงานหลังล้าง',0]]:WI._);
  T.wi = T.wi || wi.map(()=>false); T.photos=T.photos||{};
  const back = `<button class="btn sm" onclick="S.techJob=null;render()">‹ งานวันนี้</button>`;
  let body = (j.notes&&(j.notes.time||j.notes.tech)?`<div class="wi" style="border-color:var(--warn)">${j.notes.time?'<b>Preferred time: '+esc(j.notes.time)+'</b>':''}${j.notes.tech?'<span>ถึงช่าง: '+esc(j.notes.tech)+'</span>':''}</div>`:'')+`<div class="wi"><b class="mono">${SLOT_T[j.si]} · ${esc(j.pmjo||j.no)}</b><b>${esc(j.custName)}</b><span class="small">${esc(j.area)} · ${j.model} (${j.group})</span><span class="small">${j.clean?'Cleaning':esc(j.sym.join(', '))}${j.code?' · <span class=code>'+j.code+'</span>':''} · ${Object.entries(j.answers).slice(0,4).map(([k,v])=>esc(Q[k][0])+' '+esc(v===true?'✓':v)).join(' · ')}</span>${j.parent?`<span class="pill p-pur">Follow-up of ${esc(j.parent)} · จ่ายแล้ว ${baht(j.pay.paidPrev)}</span>`:''}</div>`;
  if(j.step===4 && !T.picked) return back+body+`<div class="wi"><b>📦 รับอะไหล่จากคลัง</b>${j.req.items.map(i=>`<span>☐ ${esc(i.n)} ×${i.q}</span>`).join('')}</div><button class="bigbtn gold" onclick="tAct('pick')">รับครบแล้ว</button>`;
  if(!T.arrive) return back+body+`<button class="bigbtn ghost">นำทาง</button><button class="bigbtn" onclick="tAct('arrive')">📍 ถึงหน้างาน</button>`;
  if(T.closedAt==null){
    body += `<b>WI วิเคราะห์อาการ <span class="small muted">(ร่าง · 📷 = ต้องถ่ายรูป)</span></b>` + wi.map(([s,ph],i)=>`<div class="wi ${T.wi[i]?'done':''}"><label style="display:flex;gap:8px;font-weight:600"><input type="checkbox" ${T.wi[i]?'checked':''} onchange="tWi(${i},this.checked)"> ${i+1}. ${esc(s)} ${ph?'📷':''}</label>${ph?`<div class="thumbs">${(T.photos[i]||[]).map(p=>`<img class="thumb" src="${p}" alt="รูปขั้น ${i+1}">`).join('')}<label class="btn sm" style="display:inline-flex;align-items:center">+ รูป<input type="file" accept="image/*" hidden onchange="tPhoto(${i},this)"></label><button class="btn sm" onclick="tFake(${i})">รูปตัวอย่าง</button></div>`:''}</div>`).join('');
    const ready = wi.every(([s,ph],i)=>T.wi[i] && (!ph || (T.photos[i]||[]).length));
    body += `<b>Repair Result</b><div class="pkg"><button class="${T.result==='ok'?'on':''}" onclick="T_set('result','ok')">✓ Fixed</button><button class="${T.result==='cont'?'on':''}" onclick="T_set('result','cont')">Needs follow-up</button></div>
      ${T.result==='cont'?`<select aria-label="Follow-up code" onchange="T_set('code',this.value)"><option value="">Select follow-up code</option>${CODES.map(([c,t])=>`<option value="${c}" ${T.code===c?'selected':''}>${c} ${t}</option>`).join('')}</select>`:''}
      <b>Parts Used</b><div class="parts">${[...new Set([...j.req.items.map(i=>i.n),...Object.keys(S.van[j.ci])])].slice(0,10).map(n=>`<label class="part"><span><input type="checkbox" ${(T.used||[]).includes(n)?'checked':''} onchange="tUse('${n}',this.checked)"> ${esc(n)}</span><span class="small muted">${j.req.items.find(i=>i.n===n)?'เบิกมา':'บนรถ '+S.van[j.ci][n]}</span></label>`).join('')}</div>
      <b>เสนอราคา (กดเลือกแพ็กเกจ)</b><div class="pkg">${PKGS.map(p=>`<button class="${(T.pkg||[]).includes(p[0])?'on':''}" onclick="tPkg('${p[0]}')">${p[1]}<small>${baht(p[2])}</small></button>`).join('')}</div>`;
    const sum = quote(j); body += `<div class="wi">${covLine(sum.cv)}${priceTable(sum.p)}${j.pay.paidPrev?`<span>Less paid ${baht(j.pay.paidPrev)}</span>`:''}<b style="font-size:16px">${sum.diff>=0?'Collect '+baht(sum.diff):'Refund to customer '+baht(-sum.diff)}</b></div>`;
    if(j.clean){ const R=T.insp=T.insp||{}; body += `<b>Inspection Checklist <span class="small muted">(check every point)</span></b>${INSPECT.map(([n,fix],i)=>`<div class="insp"><span>${n}</span><span class="pf"><button class="${R[i]==='ok'?'on ok':''}" onclick="T_insp(${i},'ok')">ผ่าน</button><button class="${R[i]==='ng'?'on ng':''}" onclick="T_insp(${i},'ng')">ไม่ผ่าน</button></span></div>`).join('')}`;
      const ng=INSPECT.filter((x,i)=>R[i]==='ng'); if(ng.length) body += `<div class="frbox"><b class="small">Repair Proposal (${ng.length} จุด)</b>${ng.map(([n,fix,pk])=>`<div class="small">• ${n}: ${fix}${pk?` <button class="btn sm" onclick="tPkg('${pk}')">${(T.pkg||[]).includes(pk)?'✓ in quote':'+ add to quote'}</button>`:''}</div>`).join('')}</div>`; }
    const M=T.meas=T.meas||{}; body += `<b>Site Readings</b><div class="meas">${MEAS.map(([k,l,u])=>`<label>${l}<span><input type="number" step="0.1" inputmode="decimal" value="${M[k]??''}" onchange="T_meas('${k}',this.value)"> ${u}</span></label>`).join('')}</div>${measCheck(j,M).map(([ok,t])=>`<p class="small"><span class="pill ${ok?'p-ok':'p-warn'}">${ok?'ปกติ':'ตรวจสอบ'}</span> ${t}</p>`).join('')}<p class="small muted">Measure after Cool + Fan Hi for at least 15 min (service manual ver.2025)</p>`;
    body += `<b>Customer Signature</b><canvas class="sig" id="sig" width="340" height="140" aria-label="Signature pad"></canvas><button class="btn sm" onclick="sigClear()">Clear</button>`;
    body += `<button class="bigbtn gold" onclick="tAct('close')" ${ready&&T.result&&(T.result==='ok'||T.code)&&(T.pkg||[]).length&&(j.clean?INSPECT.every((x,i)=>T.insp&&T.insp[i]):MEAS.every(m=>T.meas&&T.meas[m[0]]!=null))?'':'disabled'}>Close Job + Send Report</button>${ready?'':'<p class="small muted">Complete the WI and take the required photos 📷</p>'}`;
    return back+body; }
  return back+body+`<div class="wi done"><b>Closed ${hm(T.closedAt)}</b><span>${T.result==='ok'?'Fixed':'Follow-up '+T.code}</span></div><button class="bigbtn ghost" onclick="reportModal('${j.no}',false)">View service report + survey QR</button>${j.step===6?'<button class="bigbtn" onclick="tAct(\'return\')">↩ Return Remaining Parts</button>':''}`; }
function quote(j){ const T=j.tech||{}; const p=price(j, T.pkg||[], T.used||[]); return {list:(T.pkg||[]).map(c=>PKGS.find(x=>x[0]===c)), items:p.svcNet, full:p.svcGross, travel:p.travelNet, total:p.pay, cv:p.cv, p, diff:p.pay-(j.pay.paidPrev||0), why:p.travelWhy}; }
function T_set(k,v){ const j=job(S.techJob); j.tech[k]=v; render(); }
function tWi(i,on){ job(S.techJob).tech.wi[i]=on; render(); }
function tUse(n,on){ const T=job(S.techJob).tech; T.used=T.used||[]; T.used = on?[...T.used,n]:T.used.filter(x=>x!==n); render(); }
function tPkg(c){ const T=job(S.techJob).tech; T.pkg=T.pkg||[]; T.pkg = T.pkg.includes(c)?T.pkg.filter(x=>x!==c):[...T.pkg,c]; render(); }
function tFake(i){ const T=job(S.techJob).tech; const cv=document.createElement('canvas'); cv.width=160; cv.height=120; const x=cv.getContext('2d'); const hue=(i*67+40)%360; x.fillStyle=`hsl(${hue} 30% 70%)`; x.fillRect(0,0,160,120); x.fillStyle='#1A2456'; x.font='bold 18px sans-serif'; x.fillText('ขั้น '+(i+1),12,66); (T.photos[i]=T.photos[i]||[]).push(cv.toDataURL('image/jpeg',.6)); render(); }
function tPhoto(i,inp){ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const cv=document.createElement('canvas'); const s=Math.min(1,320/im.width); cv.width=im.width*s; cv.height=im.height*s; cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height); const T=job(S.techJob).tech; (T.photos[i]=T.photos[i]||[]).push(cv.toDataURL('image/jpeg',.6)); render(); }; im.src=r.result; }; r.readAsDataURL(f); }
function tAct(a){ const j=job(S.techJob), T=j.tech; const tn=(S.roster[j.date][j.ci]||['Technician'])[0]+' (Technician)';
  const L=t=>j.hist.push({t:fmtD(S.day).slice(3,8)+' '+hm(S.now), who:tn, text:t});
  if(a==='pick'){ T.picked=true; j.step=5; L('All parts received'); }
  if(a==='arrive'){ T.arrive=S.now; j.step=5; L('ถึงหน้างาน '+hm(S.now)+' (GPS ในระยะ)'); }
  if(a==='close'){ const q=quote(j); T.closedAt=S.now; T.sig = true; j.pay={...j.pay, items:q.list, travel:q.travel, total:q.total, method:q.diff>=0?'เงินสด':'—'};
    (T.used||[]).forEach(n=>{ if(!j.req.items.find(i=>i.n===n) && S.van[j.ci][n]!=null) S.van[j.ci][n]=Math.max(0,S.van[j.ci][n]-1); });
    if(q.diff<0) j.refund={state:'approve', amount:-q.diff, at:fmtD(TODAY)};
    const left = j.req.items.filter(i=>!(T.used||[]).includes(i.n)); j.step = left.length?6:7;
    L('Job closed: '+(T.result==='ok'?'Fixed':'Follow-up '+T.code)+' · '+(q.diff>=0?'Collect '+baht(q.diff):'Refund '+baht(-q.diff))+' · service report sent'); }
  if(a==='return'){ L('Remaining parts returned – awaiting warehouse'); toast('Returned – awaiting warehouse'); }
  render(); }
let sigDraw=false;
function afterTech(){ const c=$('#sig'); if(!c) return; const x=c.getContext('2d'); x.lineWidth=2.2; x.lineCap='round'; x.strokeStyle=getComputedStyle(document.body).color;
  const pos=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.onpointerdown=e=>{sigDraw=true;x.beginPath();x.moveTo(...pos(e));c.setPointerCapture(e.pointerId)}; c.onpointermove=e=>{if(sigDraw){x.lineTo(...pos(e));x.stroke()}}; c.onpointerup=()=>sigDraw=false; }
function sigClear(){ const c=$('#sig'); c.getContext('2d').clearRect(0,0,c.width,c.height); }

async function pdPhotos(no){ const j=job(no); const ph=Object.values(j.tech.photos||{}).flat(); const m=document.getElementById('pdMsg');

function price(j,pkgs,used){ if(!pkgs.length&&j.pay&&(j.pay.items||[]).length) pkgs=j.pay.items.map(p=>p[0]); const cu=S.customers.find(c=>c.id===j.cust); const t=ctypeOf(cu,j.date); const cv=coverage(j); const L=[]; const r2=x=>Math.round(x*100)/100;
  const svc=pkgs.map(c=>PKGS.find(x=>x[0]===c)).filter(Boolean); const repairSvc=svc.filter(p=>!PKG_KIND[p[0]]);
  const typeDisc={'พนักงานมหาจักร':0.2,'บริษัทในเครือมหาจักร':0.3}[t]||0;

  let vip = t==='ลูกค้า VIP' ? (cu.vip||0)/100 : 0; if(multi && vip) vip = vip>0.2 ? vip : 0; const useMulti = multi && !(vip>0.2);

    if(kind==='clean'){ L.push({k:'clean',n:p[1],g:p[2],net,note:'Per cleaning contract'}); return; }
    if(cv&&cv.labor){ net=0; note='In warranty (claim)'; }

    L.push({k:'svc',n:p[1],g:p[2],net,note}); });
  let travel=TRAVEL, tnote='';

  else if(t==='ลูกค้ามีสัญญาบริการ'){ travel=400; tnote='Contract customer – 400'; } else if(typeDisc){ travel=TRAVEL*(1-typeDisc); tnote='−'+typeDisc*100+'%'; } else if(vip){ travel=TRAVEL*(1-vip); tnote='VIP −'+vip*100+'%'; }

function shrink(f,max,q){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q)); }; im.onerror=()=>res(null); im.src=r.result; }; r.readAsDataURL(f); }); }

function sigInit(){ const c=document.getElementById('sigc'); if(!c) return; const r0=c.getBoundingClientRect(); c.width=r0.width*2; c.height=r0.height*2; const x=c.getContext('2d'); x.lineWidth=5; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#10142A';
  const T=T_(J()); if(T.sig){ const im=new Image(); im.onload=()=>x.drawImage(im,0,0,c.width,c.height); im.src=T.sig; }
  const p=e=>{ const r=c.getBoundingClientRect(); return [(e.clientX-r.left)*2,(e.clientY-r.top)*2]; }; let d=false;
  c.onpointerdown=e=>{ if(T.closedAt!=null) return; d=true; x.beginPath(); x.moveTo(...p(e)); c.setPointerCapture(e.pointerId); };
  c.onpointermove=e=>{ if(d){ x.lineTo(...p(e)); x.stroke(); } };
  c.onpointerup=()=>{ if(!d) return; d=false; T.sig=c.toDataURL('image/png'); persist(); updAb(); }; }
function sigClear(){ T_(J()).sig=null; rr(); }
async function scanFile(inp){ const f=inp.files[0]; if(!f) return; TA.scanMsg='กำลังอ่านบาร์โค้ด…'; tRender(); const url=await shrink(f,1400,.9); let code=null;
  try{ if('BarcodeDetector' in window){ const im=new Image(); im.src=url; await im.decode(); const r=await new BarcodeDetector().detect(im); if(r[0]) code=r[0].rawValue; } }catch(e){}
  if(!code && window.ZXing){ try{ const r=await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(url); code=r.getText(); }catch(e){} }
  if(!code){ TA.scanMsg='อ่านบาร์โค้ดไม่ได้ — พิมพ์รหัสอะไหล่แทน'; tRender(); return; }
  const hit=ITEMS.find(r=>r[0]===code)||ITEMS.find(r=>r[1]===code||r[2]===code);
  if(hit) addPart(hit[0]); else { TA.q=code; TA.scanMsg='ไม่พบรหัส '+code+' ใน NAV Items'; tRender(); } }

  return timeHtml(j)+contractHtml(j)+`<section class="card"><h3>${j.clean?'ขั้นตอนการล้าง':'WI ตามอาการ'} <small>📷 = ต้องถ่ายรูป</small></h3>${wi.map(([s,ph],i)=>`<div class="chk"><input type="checkbox" id="wi${i}" ${T.wi[i]?'checked':''} ${lk?'disabled':''} onchange="setTm('wi',${i},this.checked)"><div class="bd"><label for="wi${i}"><b>${i+1}.</b> ${esc(s)} ${ph?'📷':''}</label>${ph?phBox('w'+i,'ขั้น '+(i+1),lk):''}</div></div>`).join('')}</section>
  ${j.clean?`<section class="card"><h3>Inspection Checklist <small>ไม่ผ่าน = แจ้งลูกค้าใน Service Report</small></h3>${INSPECT.map((x,i)=>`<div class="li"><span>${esc(x[0])}</span><span class="row"><button class="btn sm ${T.insp[i]==='ok'?'okb':''}" ${lk?'disabled':''} onclick="setTm('insp',${i},'ok')">ผ่าน</button><button class="btn sm ${T.insp[i]==='ng'?'badb':''}" ${lk?'disabled':''} onclick="setTm('insp',${i},'ng')">ไม่ผ่าน</button></span></div>`).join('')}</section>`:''}
  ${R.length?`<section class="card"><h3>อะไหล่ที่เบิกมา <small>ติ๊กชิ้นที่ใช้ ชิ้นที่เหลือต้องคืนคลังภายใน 3 ชม.</small></h3>${R.map((r,i)=>`<label class="chk"><input type="checkbox" ${T.reqUsed[i]?'checked':''} ${lk?'disabled':''} onchange="setTm('reqUsed',${i},this.checked)"><span class="bd">${esc(r.n)} × ${r.q}</span></label>`).join('')}</section>`:''}
  <section class="card"><h3>อะไหล่จาก NAV ที่ใช้เพิ่ม</h3>${partsUI(j,lk)}${T.quoteOk&&!T.quoteOk.declined&&Math.abs(bill(j).total-T.quoteOk.total)>0.01?`<div class="note">ยอดเปลี่ยนจากที่ลูกค้ายอมรับ (${baht(T.quoteOk.total)} → ${baht(bill(j).total)}) แจ้งลูกค้าก่อนปิดงาน</div>`:''}</section>
  <section class="card"><h3>วัดค่าหลังทำงาน</h3>${measTable(j,'meas',lk)}</section>
  <section class="card"><h3>รูปหลังทำงาน</h3><div class="slot ${(T.photos.after||[]).length?'got':'need'}">${phBox('after','หลังทำงาน',lk)}</div></section>`; }
function S_result(j,lk){ const T=T_(j);
  return `<section class="card"><h3>ผลงาน</h3><div class="row"><button class="btn ${T.result==='ok'?'okb':''}" style="flex:1;min-height:56px" ${lk?'disabled':''} onclick="setResult('ok')">✓ แก้ไขสำเร็จ</button><button class="btn ${T.result==='cont'?'badb':''}" style="flex:1;min-height:56px" ${lk?'disabled':''} onclick="setResult('cont')">ต้องต่องาน</button></div>
    ${T.result==='cont'?`<label class="fld" for="ccode">รหัสต่องาน<select class="in" id="ccode" ${lk?'disabled':''} onchange="setT('code',this.value)"><option value="">— เลือก —</option>${CODES.map(([c,t])=>`<option value="${c}" ${T.code===c?'selected':''}>${c} ${esc(t)}</option>`).join('')}</select></label>
      ${CONT_PHOTO.test(T.code||'')?`<div class="slot ${(T.photos.cont||[]).length?'got':'need'}"><b>รูปหลักฐาน (หน้างาน/ตัวสินค้า)</b>${phBox('cont','หลักฐาน',lk)}</div>`:''}
      <div class="note info">เมื่อปิดงาน ระบบสร้างคำขอนัดต่องานเข้าคิวโฟแมน และเสนอทีมเดิม</div>`:''}
    <label class="fld" for="rmk">หมายเหตุถึงโฟแมน / ธุรการ<textarea class="in" id="rmk" ${lk?'disabled':''} onchange="setT('remark',this.value)">${esc(T.remark||'')}</textarea></label></section>`; }
function docHtml(j,edit){ const T=T_(j), cu=cuOf(j), b=bill(j); const ed=(k,lab)=>`<div><h4>${lab}</h4>${edit?`<textarea class="in" id="rp_${k}" onchange="repSet('${k}',this.value)">${esc(repGet(j,k))}</textarea>${T.rep[k]!=null?`<button class="btn sm" style="margin-top:4px" onclick="repReset('${k}')">ใช้ข้อความจากระบบ</button>`:''}`:`<p>${esc(repGet(j,k))}</p>`}</div>`;
  const ph=[['before','ก่อน'],['after','หลัง'],['nameIn','ป้าย Indoor'],['cont','หลักฐาน']].flatMap(([k,l])=>(T.photos[k]||[]).slice(0,2).map(p=>[p,l])).slice(0,8);
  const ms = MEAS.filter(m=>T.measB[m[0]]!=null||T.meas[m[0]]!=null);
  return `<article class="doc" aria-label="Service Report"><div class="doc-h"><div><b>Service Report</b><div class="small muted">Mahajak Service · Mitsubishi Heavy Duty</div></div><span>${esc(j.pmjo||j.no)}<br>${fmtD(TODAY)}</span></div>
    <div class="g2"><div><h4>ลูกค้า</h4><p>${esc(j.custName)}<br>${esc(cu.id)} · ${esc(j.area)}</p></div><div><h4>เครื่อง</h4><p>${esc(j.model)} (${esc(j.group)})<br>S/N ${esc(T.snFound||(machineOf(j)[0]||{}).serial||'—')}</p></div></div>
    <div><h4>ช่างผู้ให้บริการ</h4><p>${esc(crewNames(j.ci).join(', '))} · เข้า ${T.arrive!=null?hm(T.arrive):'—'} · ปิดงาน ${T.closedAt!=null?hm(T.closedAt):'—'}</p></div>
    ${ed('find','สิ่งที่ตรวจพบ')}${ed('work','งานที่ดำเนินการ')}
    ${ms.length?`<div><h4>ค่าที่วัด</h4><div style="overflow-x:auto"><table><thead><tr><th>ค่า</th><th>ก่อน</th><th>หลัง</th></tr></thead><tbody>${ms.map(([k,l,u])=>`<tr><td>${MEAS_TH[k]} (${u})</td><td>${T.measB[k]??'—'}</td><td>${T.meas[k]??'—'}</td></tr>`).join('')}</tbody></table></div></div>`:''}
    ${health(j,T.meas)!=null?`<div><h4>สภาพเครื่องหลังทำงาน</h4><p>${health(j,T.meas)}/100${superheat(j,T.meas)!=null?' · Superheat '+superheat(j,T.meas)+' K':''}${T.workStart!=null&&T.workAt!=null?' · ใช้เวลา '+(T.workAt-T.workStart)+' นาที':''}</p></div>`:''}
    <div><h4>ผล</h4><p>${T.result==='ok'?'แก้ไขสำเร็จ':T.result==='cont'?'ต้องเข้าบริการต่อ ('+esc(T.code||'')+')':'—'}</p></div>
    ${ed('adv','คำแนะนำ')}
    ${ph.length?`<div><h4>รูปประกอบ</h4><div class="phs">${ph.map(([p,l])=>`<figure><img src="${p}" alt="${l}"><figcaption>${l}</figcaption></figure>`).join('')}</div></div>`:''}
    <div class="tot"><span>ค่าบริการรวม</span><b>${baht(b.total)}</b></div>
    <div class="sigline"><div>${T.sig?`<img src="${T.sig}" alt="ลายเซ็นลูกค้า">`:''}ลูกค้า</div><div>${esc(crewNames(j.ci)[0])}<br>ช่างผู้ให้บริการ</div></div></article>`; }
function S_report(j,lk){ const T=T_(j);
  return `<div class="note info">${lk?'ปิดงานแล้ว — Service Report ถูกล็อก':'แก้ไขข้อความได้จนกว่าจะปิดงาน · ระบบร่างจากข้อมูลที่บันทึกไว้ · ถ้าแก้หลังลูกค้าเซ็น ต้องให้ลูกค้าเซ็นใหม่'}</div>${docHtml(j,!lk)}
  ${lk||T.rep.ok?'':''}`; }
function S_close(j,lk){ const T=T_(j), b=bill(j), cu=cuOf(j); const corp=/บริษัท/.test(ctypeOf(cu,j.date));
  return `<section class="card"><h3>ยอดเก็บเงิน</h3><div class="tot"><span>ยอดที่ลูกค้าต้องชำระ</span><b>${baht(b.total)}</b></div>${T.quoteOk&&T.quoteOk.total?`<p class="small muted" style="margin:0">ลูกค้ายอมรับไว้ ${baht(T.quoteOk.total)}</p>`:''}
    ${T.quoteOk&&T.quoteOk.total&&Math.abs(b.total-T.quoteOk.total)>T.quoteOk.total*0.1?`<label class="fld" for="dw">เหตุผลที่ยอดต่างเกิน 10%<input class="in" id="dw" value="${esc(T.diffWhy||'')}" ${lk?'disabled':''} onchange="setT('diffWhy',this.value)"></label>`:''}
    <div class="row">${PAYM.filter(([k])=>k==='none'?b.total===0:k==='later'?corp:b.total>0).map(([k,l])=>`<button class="btn ${T.payM===k?'on':''}" ${lk?'disabled':''} onclick="setT('payM','${k}')">${l}</button>`).join('')}</div>
    ${T.payM==='cash'?`<div class="g2"><label class="fld" for="cash">รับเงินมา<input class="in mono" id="cash" type="number" inputmode="decimal" value="${T.cash||''}" ${lk?'disabled':''} onchange="setT('cash',this.value)"></label><div class="fld">เงินทอน<b class="mono" style="font-size:20px;color:var(--t-ink)">${baht(Math.max(0,(+T.cash||0)-b.total))}</b></div></div>`:''}
    ${T.payM==='qr'?`<div class="note info">ให้ลูกค้าสแกน PromptPay ยอด ${baht(b.total)} อ้างอิง ${esc(j.pmjo||j.no)} แล้วถ่ายรูปสลิป</div>${phBox('slip','สลิป',lk)}`:''}</section>
  <section class="card"><h3>ลายเซ็นลูกค้า <small>ลูกค้าตรวจ Service Report แล้วเซ็นรับงาน</small></h3><canvas id="sigc" class="sig" aria-label="ช่องลายเซ็นลูกค้า"></canvas>${lk?'':'<div class="row"><button class="btn sm" onclick="sigClear()">ล้างลายเซ็น</button></div>'}</section>`; }
function S_ret(j,lk){ const T=T_(j), L=left(j);
  return `<section class="card"><h3>คืนอะไหล่ที่ไม่ได้ใช้ <small>กำหนดภายใน 3 ชม. หลังปิดงาน${T.closedAt!=null?' (ก่อน '+hm(T.closedAt+180)+')':''}</small></h3>
    ${L.length?L.map(r=>`<div class="li"><span>${esc(r.n)} × ${r.q}</span><span class="pill ${T.returned?'ok':'warn'}">${T.returned?'ส่งคืนแล้ว':'รอส่งคืน'}</span></div>`).join(''):'<p class="muted" style="margin:0">ไม่มีอะไหล่ต้องคืน</p>'}
    ${T.returned?`<div class="note ok">ส่งคืน ${hm(T.returned)} — รอคลังยืนยันรับคืน</div>`:''}</section>
  <section class="card"><h3>Service Report ที่ส่งลูกค้า</h3>${docHtml(j,false)}</section>`; }

function vJob(j){ const T=T_(j); const cur=curStage(j); const vk=TA.view!=null&&TA.view<=cur?TA.view:cur; const lk = T.closedAt!=null ? STG[vk][0]!=='ret' : (vk<cur && ['prep','call','arrive','quote'].includes(STG[vk][0]) && done(j,vk));
  const body={prep:S_prep,call:S_call,arrive:S_arrive,check:S_check,quote:S_quote,work:S_work,result:S_result,report:S_report,close:S_close,ret:S_ret}[STG[vk][0]](j,lk);
  if(TA.focus) return vFocus(j,vk,cur,body);
  return `<div class="ws-in">${vHead(j)}${vSteps(j,cur,vk)}<div class="row" style="justify-content:flex-end;margin-top:-6px"><button class="btn gold" onclick="focusOn()">▶ ${['check','work','arrive'].includes(STG[vk][0])?'เริ่มทำงาน (โหมดโฟกัส)':'โหมดโฟกัส'}</button></div><h2 style="margin:4px 0 0;font-size:19px">${vk+1}. ${STG[vk][1]}${vk!==cur?' <span class="pill">ดูย้อนหลัง</span>':''}</h2>${body}</div>${vAb(j,vk,cur)}`; }
function vAb(j,vk,cur){ const T=T_(j); const key=STG[vk][0]; if(vk!==cur && !(key==='report'||key==='close') ) return `<div class="ab"><span class="need">กำลังดูขั้นที่ทำไปแล้ว</span><button class="btn pri" onclick="TA.view=null;tRender()">กลับไปขั้นปัจจุบัน</button></div>`;
  if(T.closedAt!=null && key!=='ret') return '';
  const n=key==='ret'?[]:need(j,vk); const lbl={prep:'พร้อมออกงาน',call:'🚐 ออกเดินทาง',arrive:'เริ่มตรวจเครื่อง',check:'บันทึกผลตรวจ',quote:'ไปขั้นซ่อม / ล้าง',work:'งานเสร็จ',result:'บันทึกผลงาน',report:'ตรวจทานแล้ว ให้ลูกค้าเซ็น',close:'ปิดงาน + ส่ง Service Report',ret:'ส่งคืนอะไหล่'}[key];
  const fn={report:'repOk()',close:'closeJob()',ret:'doReturn()'}[key]||`finish(${vk})`;
  if(key==='ret' && (!left(j).length||T.returned)) return '';
  if(key==='quote' && !T.quoteOk) return `<div class="ab" id="ab"><span class="need">ให้ลูกค้ากดยอมรับราคาในหน้านี้ก่อนเริ่มงาน</span></div>`;
  return `<div class="ab" id="ab"><span class="need" id="abn">${n.length?'ยังขาด: <b>'+n.slice(0,3).map(esc).join(' · ')+'</b>'+(n.length>3?' และอีก '+(n.length-3)+' รายการ':''):'ครบแล้ว'}</span><button class="btn ${key==='close'?'gold':'pri'}" id="abb" ${n.length?'disabled':''} onclick="${fn}">${lbl}</button></div>`; }
function updAb(){ const j=J(); if(!j) return; const cur=curStage(j); const vk=TA.view!=null&&TA.view<=cur?TA.view:cur; const n=need(j,vk); const b=document.getElementById('abb'), t=document.getElementById('abn'); if(b) b.disabled=!!n.length; if(t) t.innerHTML=n.length?'ยังขาด: <b>'+n.slice(0,3).map(esc).join(' · ')+'</b>':'ครบแล้ว'; }

function vSheet(){ if(!TA.sheet) return ''; const L=teamJobs().filter(j=>j.dispatched);
  if(TA.sheet==='route'){ const open=L.filter(j=>T_(j).closedAt==null); const ad=j=>{ const cu=cuOf(j); return encodeURIComponent((j.area||'').replace(/^เขต/,'เขต ')+' กรุงเทพมหานคร'); };
    const url=open.length?'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+ad(open[open.length-1])+(open.length>1?'&waypoints='+open.slice(0,-1).map(ad).join('%7C'):''):'';
    return `<div class="tov" onclick="if(event.target===this){TA.sheet=null;tRender()}"><div class="tsheet" role="dialog" aria-label="เส้นทางวันนี้"><h2>เส้นทางวันนี้ <button class="btn sm" onclick="TA.sheet=null;tRender()">ปิด</button></h2>
      <div class="list">${L.map((j,i)=>`<div class="li"><span><b class="mono">${SLOT_T[j.si]}</b> · ${esc(j.custName)}<br><span class="small muted">${esc(j.area)} · เขต ${zoneOfArea(j.area)}${inZone(j)?'':' (นอกเขตวันนี้)'}</span></span><span class="pill ${lane(j)[1]}">${lane(j)[0]}</span></div>`).join('')}</div>
      ${url?`<a class="btn pri" href="${url}" target="_blank" rel="noopener">เปิดเส้นทางงานที่เหลือใน Google Maps</a>`:'<div class="note ok">ปิดงานครบแล้ว</div>'}<p class="small muted" style="margin:0">ใช้เขตของลูกค้าเป็นจุดหมาย เพราะบ้านเลขที่ถูกปิดบังในข้อมูลตัวอย่าง</p></div></div>`; }
  const C=L.filter(j=>T_(j).closedAt!=null); const sum=m=>C.filter(j=>T_(j).payM===m).reduce((s,j)=>s+(j.pay.total||0),0);
  const ret=C.filter(j=>left(j).length&&!T_(j).returned); const cont=C.filter(j=>T_(j).result==='cont');
  return `<div class="tov" onclick="if(event.target===this){TA.sheet=null;tRender()}"><div class="tsheet" role="dialog" aria-label="สรุปท้ายวัน"><h2>สรุปท้ายวัน · ${fmtD(TODAY)} <button class="btn sm" onclick="TA.sheet=null;tRender()">ปิด</button></h2>
    <div class="stat"><div><span>งานทั้งหมด</span><b>${L.length}</b></div><div><span>ปิดแล้ว</span><b>${C.length}</b></div><div><span>ต่องาน</span><b>${cont.length}</b></div><div><span>ค้างคืนอะไหล่</span><b>${ret.length}</b></div></div>
    <div class="card"><h3>เงินที่ต้องนำส่ง</h3><div class="li"><span>เงินสด (ส่งการเงิน)</span><b class="mono">${baht(sum('cash'))}</b></div><div class="li"><span>โอน QR (แนบสลิปแล้ว)</span><b class="mono">${baht(sum('qr'))}</b></div><div class="li"><span>โอนภายหลัง (นิติบุคคล)</span><b class="mono">${baht(sum('later'))}</b></div></div>
    ${C.length?`<div class="card"><h3>รายการปิดงาน</h3>${C.map(j=>`<div class="li"><span class="mono small">${esc(j.pmjo||j.no)}</span><span>${esc(j.custName)}</span><span class="pill ${T_(j).result==='cont'?'bad':'ok'}">${T_(j).result==='cont'?'ต่องาน '+T_(j).code:'สำเร็จ'}</span><b class="mono">${baht(j.pay.total)}</b></div>`).join('')}</div>`:''}
    ${ret.length?`<div class="note">ยังไม่คืนอะไหล่: ${ret.map(j=>esc(j.pmjo||j.no)).join(', ')}</div>`:''}</div></div>`; }

function tRender(){ let root=document.getElementById('tapp'); if(!root){ root=document.createElement('div'); root.id='tapp'; document.body.appendChild(root); }
  const y=scrollY; if(TA.team==null){ root.innerHTML=vLogin(); return; }
  const j=TA.open?job(TA.open):null;
  root.innerHTML = vTop()+`<div class="tw ${j?'open':''}">${vRail()}<main class="ws">${j?vJob(j):'<div class="ws-in"><div class="note info">เลือกงานจากรายการด้านซ้าย</div></div>'}</main></div>`+vSheet();
  if(TA.focus&&j) applyFocus(); sigInit(); if(!TA.focus) scrollTo({top:y}); ipadScroll(); }
function ipadScroll(){ try{ const c=document.querySelector('#tapp .stp button.cur'); if(c&&c.parentNode.scrollWidth>c.parentNode.clientWidth) c.parentNode.scrollLeft=c.offsetLeft-c.parentNode.clientWidth/2+c.offsetWidth/2;
  const a=document.querySelector('#tapp .rail-l .jc.on, #tapp .rail-l .jc.sel, #tapp .rail-l .jc[aria-current]'); if(a&&a.parentNode.scrollWidth>a.parentNode.clientWidth) a.parentNode.scrollLeft=a.offsetLeft-12; }catch(e){} }
addEventListener('orientationchange',()=>setTimeout(()=>{ if(window.tRender) tRender(); },250));
function tBoot(){ try{ load(); }catch(e){ seedState(); } const t=lsG(TT_KEY,null); TA.team = (t!=null && S.crews[t]) ? t : null;
  if(TA.team!=null){ const nx=teamJobs().find(j=>j.dispatched&&T_(j).closedAt==null); TA.open=nx?nx.no:null; } tRender(); }

/* ป้ายภาษาไทยสำหรับช่าง (ข้อมูลกลางใช้ชื่ออังกฤษตาม v15) */
const MEAS_TH={p:'แรงดันน้ำยาด้านดูด',a:'กระแสคอมเพรสเซอร์',ti:'อุณหภูมิลมเข้า',to:'อุณหภูมิลมออก',v:'แรงดันไฟ'};
const PK_TH={CL01:'ล้าง 1 เครื่อง',RE01:'ค่าบริการอาการที่ 1',RE02:'ค่าบริการอาการที่ 2',RE10:'เปลี่ยนแผง PCB',RE11:'เปลี่ยนมอเตอร์พัดลม',RE12:'เปลี่ยนเซ็นเซอร์',RE13:'เติมน้ำยา',RE14:'แก้ท่อน้ำทิ้ง',RE15:'เปลี่ยนคาปาซิเตอร์'};

  .replace(/Total \(incl\. VAT\)/g,'รวม (รวม VAT)').replace(/Withholding tax 3%/g,'หัก ณ ที่จ่าย 3%').replace(/on service \+ travel before VAT · parts\/refrigerant excluded/g,'คิดจากค่าบริการ+ค่าเดินทางก่อน VAT').replace(/Customer Pays/g,'ลูกค้าชำระ')

/* 2) Superheat จากแรงดันด้านดูด + อุณหภูมิท่อดูด (ตาราง P–T โดยประมาณ) และคะแนนสภาพเครื่อง */
const PT={R32:[[86,-5],[103.3,0],[123.3,5],[145.9,10],[171,15]], R410A:[[83.8,-5],[101,0],[120.7,5],[142.7,10],[167,15]]};
const SH_STD=[5,10];
function refOf(j){ const md=MODELS.find(m=>m.m===j.model)||{}; return md.inv?'R32':'R410A'; }
function satT(ref,psi){ const t=PT[ref]; if(psi==null) return null; let a=t[0],b=t[1]; for(let i=1;i<t.length;i++){ a=t[i-1]; b=t[i]; if(psi<=b[0]) break; } return a[1]+(psi-a[0])*(b[1]-a[1])/(b[0]-a[0]); }
function superheat(j,M){ if(M.p==null||M.sl==null) return null; return Math.round((M.sl-satT(refOf(j),M.p))*10)/10; }
function shHtml(j,o,lk){ const M=T_(j)[o]; const sh=superheat(j,M);
  return `<div class="g2" style="align-items:end"><label class="fld" for="sl_${o}">อุณหภูมิท่อดูดที่วาล์วบริการ (°C) <span class="small">ไม่บังคับ</span><input class="in mono" id="sl_${o}" type="number" step="0.1" inputmode="decimal" value="${M.sl??''}" ${lk?'disabled':''} onchange="setMeas('${o}','sl',this.value)"></label>
   <div class="fld">Superheat (${refOf(j)})${sh==null?'<span class="small">กรอกแรงดันด้านดูดและอุณหภูมิท่อดูด</span>':`<span class="row"><b class="mono" style="font-size:20px;color:var(--t-ink)">${sh} K</b><span class="pill ${sh>=SH_STD[0]&&sh<=SH_STD[1]?'ok':'bad'}">${sh<SH_STD[0]?'ต่ำ (น้ำยาเกิน/ลมน้อย)':sh>SH_STD[1]?'สูง (น้ำยาน้อย)':'ปกติ'}</span></span>`}</div></div>
   <p class="small muted" style="margin:0">เกณฑ์ Superheat ${SH_STD[0]}–${SH_STD[1]} K เป็นค่าอ้างอิงทั่วไป รอหัวหน้าช่างยืนยัน</p>`; }
function health(j,M){ const c=measCheck(j,M); const sh=superheat(j,M); const all=[...c.map(x=>x[0]), ...(sh==null?[]:[sh>=SH_STD[0]&&sh<=SH_STD[1]])]; if(!all.length) return null; return Math.round(all.filter(Boolean).length/all.length*100); }
function healthPill(j,M){ const h=health(j,M); if(h==null) return ''; return `<span class="pill ${h>=80?'ok':h>=50?'warn':'bad'}">สภาพเครื่อง ${h}/100</span>`; }

  prev.textContent = TA.fi===0 ? 'ภาพรวม' : 'ย้อน'; prev.onclick = TA.fi===0 ? focusOff : ()=>fGo(-1);
  if(TA.fi<n-1){ next.textContent='ถัดไป'; next.disabled=false; next.onclick=()=>fGo(1); nd.textContent=''; }
  else { const a=fxActions(j,vk); next.textContent=a.lbl; next.disabled=!!a.n.length||!a.fn; next.onclick=()=>{ if(a.fn){ TA.fi=0; (new Function(a.fn))(); } };
    nd.innerHTML = a.n.length ? 'ยังขาด: '+a.n.slice(0,4).map(esc).join(' · ')+(a.n.length>4?' และอีก '+(a.n.length-4):'') : ''; } }

/* ===================== v11 UI — one screen, one task ===================== */
/* later function declarations replace the v10 ones of the same name */
function telOf(j){ const cu=cuOf(j); return String(cu.phone||j.phone||''); }
function mapOf(j){ return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((j.area||'').replace(/^เขต/,'เขต ')+' กรุงเทพมหานคร'); }
function vTop(){ const c=S.crews[TA.team]; const L=teamJobs(); const ret=L.filter(j=>T_(j).closedAt!=null&&left(j).length&&!T_(j).returned).length;
  const sb=standbyOn(c,TODAY);
  return `<header class="tb"><div class="brand" aria-hidden="true">M</div>
    <div class="who"><b>${esc(crewNames(TA.team).join(' · '))}</b><span>${fmtD(TODAY)} · ${c.type==='EMP'?'คู่ '+c.team.replace('Pair ','')+' · รถ '+c.veh:'ช่างซับ'} · เขต ${esc(zoneOn(c,TODAY))}${sb?' · สแตนบาย':''}</span></div>
    ${TA.offline?'<span class="off">ออฟไลน์ · เก็บในเครื่องแล้ว</span>':''}
    <nav class="acts" aria-label="เมนู"><button class="tbb" onclick="TA.sheet='route';tRender()">เส้นทาง</button><button class="tbb" onclick="TA.sheet='day';tRender()">สรุปวันนี้${ret?`<span class="cnt" aria-label="ค้างคืนอะไหล่">${ret}</span>`:''}</button><button class="tbb ghost" onclick="logout()" aria-label="ออกจากระบบ">ออก</button></nav></header>`; }

function laneCls(j){ const T=T_(j); if(!j.dispatched) return 'st-hold'; if(T.closedAt!=null) return left(j).length&&!T.returned?'st-ret':'st-fm'; return 'st-tn'; }
function vRail(){ const L=teamJobs(); const fin=L.filter(j=>T_(j).closedAt!=null).length;
  const nw=newJobs();
  return `<aside class="rail" aria-label="งานวันนี้"><div class="rail-h"><h2>งานวันนี้</h2><span class="cntx">${fin}/${L.length} เสร็จ</span></div>
  ${nw.length?`<div class="newb" role="status"><span><b>งานใหม่ ${nw.length}</b> จากโฟแมน</span><button onclick="ackNew()">รับทราบ</button></div>`:''}
  <div class="rail-l">${L.length?L.map(j=>{ const [t]=lane(j); const on=TA.open===j.no; return `<button class="jc ${laneCls(j)} ${on?'on':''}" ${j.dispatched?'':'disabled'} ${on?'aria-current="true"':''} onclick="TA.open='${j.no}';TA.view=null;TA.focus=false;TA.info=false;tRender();scrollTo({top:0})">
    <span class="tm">${SLOT_T[j.si]}${j.span===2?'<small> · 2 ช่อง</small>':''}</span>
    <span class="nm">${esc(j.custName)}</span>
    <span class="mt">${esc(j.area)} · ${j.clean?'ล้าง':esc(j.sym[0]||'ซ่อม')}${j.parent?' · ต่องาน':''}</span>
    <span class="st">${esc(t)}</span></button>`; }).join('') : '<p class="empty">ยังไม่มีงานของทีมนี้วันนี้</p>'}</div></aside>`; }

function vHead(j){ const cu=cuOf(j), T=T_(j); const tel=telOf(j);
  const flags=[repeatOf(j)?'<span class="flag bad">งานซ้ำใน 30 วัน</span>':'', j.parent?'<span class="flag warn">ต่องาน</span>':'', /VIP/.test(ctypeOf(cu,j.date))?'<span class="flag">VIP</span>':'', contractActive(cu,j.date)?'<span class="flag ok">มีสัญญา</span>':''].join('');
  return `<button class="back" onclick="TA.open=null;tRender()">‹ งานวันนี้</button>
  <section class="jh"><div class="jh-l"><div class="time">${SLOT_T[j.si]}${T.eta?`<small>แจ้งลูกค้า ${esc(T.eta)}</small>`:''}</div>
    <div class="jh-m"><h1>${esc(j.custName)}</h1><p>${esc(j.area)} · ${esc(j.model)} · ${j.clean?'งานล้าง':'ซ่อม: '+esc(j.sym.join(', '))}</p>${flags?`<div class="flags">${flags}</div>`:''}</div></div>
    <div class="jh-a"><a class="hb" href="tel:${esc(tel.replace(/[^0-9+]/g,''))}" onclick="call('${esc(tel)}')"><span aria-hidden="true">☎</span>โทร</a><a class="hb" href="${mapOf(j)}" target="_blank" rel="noopener"><span aria-hidden="true">➤</span>นำทาง</a><button class="hb" onclick="TA.info=true;tRender()"><span aria-hidden="true">ⓘ</span>ข้อมูล</button></div></section>
  ${j.notes&&(j.notes.time||j.notes.tech)?`<div class="memo">${j.notes.time?'<b>ลูกค้าสะดวก '+esc(j.notes.time)+'</b> ':''}${j.notes.tech?esc(j.notes.tech):''}</div>`:''}`; }

function vInfo(j){ if(!TA.info) return ''; const cu=cuOf(j), cv=coverage(j); const m=machineOf(j)[0]||{};
  const row=(k,v)=>`<div class="ir"><span>${k}</span><b>${v}</b></div>`;
  return `<div class="ov" onclick="if(event.target===this){TA.info=false;tRender()}"><div class="sheet" role="dialog" aria-label="ข้อมูลงาน"><div class="sh-h"><h2>ข้อมูลงาน</h2><button class="x" onclick="TA.info=false;tRender()" aria-label="ปิด">✕</button></div>
    ${row('ใบสั่งงาน',esc(j.pmjo||j.no))}${row('ลูกค้า',esc(j.custName)+' · '+esc(cu.id||''))}${row('ประเภทลูกค้า',esc(ctypeOf(cu,j.date)))}${row('ที่อยู่',esc((cu.addr||'')+' '+j.area))}${row('โทร',esc(telOf(j)))}
    ${row('เครื่อง',esc(j.model)+' ('+esc(j.group)+')')}${row('Serial',esc(m.serial||'—'))}${row('Service Item',svi(cu.id,0))}
    ${cv?row('ประกันค่าบริการ/เดินทาง',cv.labor?'<span class="ok">อยู่ในประกัน</span>':'หมดประกัน')+row('ประกันอะไหล่',cv.parts?'<span class="ok">อยู่ในประกัน</span>':'หมดประกัน')+row('ติดตั้งโดย',esc(cv.inst)):''}
    ${row('อาการที่แจ้ง',j.clean?'งานล้าง':esc(j.sym.join(', '))+(j.code?' · '+esc(j.code):''))}${j.parent?row('ต่องานจาก',esc(j.parent)+' · จ่ายแล้ว '+baht(j.pay.paidPrev)):''}
  </div></div>`; }

function vSteps(j,cur,vk){ const nxt=STG[cur+1];
  return `<section class="pg" aria-label="ความคืบหน้า"><div class="pg-t"><span class="pg-n">ขั้น ${vk+1}<small>/${STG.length}</small></span><b>${STG[vk][1]}</b>${vk!==cur?'<span class="flag">ดูย้อนหลัง</span>':(nxt?`<span class="pg-x">ถัดไป: ${nxt[1]}</span>`:'')}</div>
  <div class="pg-b">${STG.map((s,k)=>{ const d=done(j,k); const can=k<=cur; return `<button class="${d?'d':''} ${k===cur?'c':''} ${k===vk?'v':''}" ${can?'':'disabled'} onclick="TA.view=${k};tRender()" aria-label="${k+1}. ${s[1]}${d?' (เสร็จ)':''}" title="${k+1}. ${s[1]}"></button>`; }).join('')}</div></section>`; }

function vJob(j){ const T=T_(j); const cur=curStage(j); const vk=TA.view!=null&&TA.view<=cur?TA.view:cur; const lk = T.closedAt!=null ? STG[vk][0]!=='ret' : (vk<cur && ['prep','call','arrive','quote'].includes(STG[vk][0]) && done(j,vk));
  const body={prep:S_prep,call:S_call,arrive:S_arrive,check:S_check,quote:S_quote,work:S_work,result:S_result,report:S_report,close:S_close,ret:S_ret}[STG[vk][0]](j,lk);
  if(TA.focus) return vFocus(j,vk,cur,body);
  const long=['check','work','quote','report'].includes(STG[vk][0]);
  return `<div class="ws-in">${vHead(j)}${vSteps(j,cur,vk)}${long&&vk===cur?`<button class="fm" onclick="focusOn()">ทำทีละข้อ (เต็มจอ) ›</button>`:''}<div class="body">${body}</div></div>${vAb(j,vk,cur)}${vInfo(j)}`; }

function vAb(j,vk,cur){ const T=T_(j); const key=STG[vk][0];
  if(vk!==cur && !(key==='report'||key==='close')) return `<div class="ab"><div class="ab-m">กำลังดูขั้นที่ทำไปแล้ว</div><button class="go alt" onclick="TA.view=null;tRender()">กลับไปขั้นปัจจุบัน</button></div>`;
  if(T.closedAt!=null && key!=='ret') return '';
  if(key==='ret' && (!left(j).length||T.returned)) return '';
  if(key==='quote' && !T.quoteOk) return `<div class="ab" id="ab"><div class="ab-m warn">ให้ลูกค้าเลือกแพ็กเกจและกดยอมรับราคาก่อน</div><button class="go" disabled>เริ่มซ่อม / ล้าง</button></div>`;
  const n=key==='ret'?[]:need(j,vk);
  const lbl={prep:'พร้อมออกงาน',call:'ออกเดินทาง',arrive:'เริ่มตรวจเครื่อง',check:'บันทึกผลตรวจ',quote:'เริ่มซ่อม / ล้าง',work:'งานเสร็จ',result:'บันทึกผลงาน',report:'ตรวจแล้ว ให้ลูกค้าเซ็น',close:'ปิดงาน + ส่ง Service Report',ret:'ส่งคืนอะไหล่แล้ว'}[key];
  const fn={report:'repOk()',close:'closeJob()',ret:'doReturn()'}[key]||`finish(${vk})`;
  return `<div class="ab" id="ab"><div class="ab-m ${n.length?'warn':'ok'}" id="abn">${abMsg(n)}</div><button class="go ${key==='close'?'money':''}" id="abb" ${n.length?'disabled':''} onclick="${fn}">${lbl} ›</button></div>`; }
function abMsg(n){ return n.length?'ยังขาด '+n.length+' รายการ: <b>'+n.slice(0,3).map(esc).join(' · ')+'</b>'+(n.length>3?' …':''):'✓ ครบแล้ว กดปุ่มเพื่อไปต่อ'; }
function updAb(){ const j=J(); if(!j) return; const cur=curStage(j); const vk=TA.view!=null&&TA.view<=cur?TA.view:cur; const n=need(j,vk); const b=document.getElementById('abb'), t=document.getElementById('abn'); if(b) b.disabled=!!n.length; if(t){ t.innerHTML=abMsg(n); t.className='ab-m '+(n.length?'warn':'ok'); } }
function ipadScroll(){ try{ const ov=document.querySelector('#tapp .ws .ov'); if(ov) document.getElementById('tapp').appendChild(ov); const a=document.querySelector('#tapp .rail-l .jc.on'); if(a&&a.parentNode.scrollWidth>a.parentNode.clientWidth) a.parentNode.scrollLeft=a.offsetLeft-16; }catch(e){} }

tBoot();
</script>
